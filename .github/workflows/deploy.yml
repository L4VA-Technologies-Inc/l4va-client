name: Deploy Client

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, dev]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install

      - name: Run linter
        run: yarn lint

      - name: Build project
        run: yarn build

  deploy-dev:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: build-check
    runs-on: [self-hosted, dev]
    steps:
      - uses: actions/checkout@v3

      - name: Create .env for Testnet
        env:
          TESTNET_ENV_VARS: ${{ secrets.TESTNET_ENV_VARS }}
        run: |
          echo "$TESTNET_ENV_VARS" > .env
          echo "Created TESTNET .env"

      - name: Build and deploy on Dev server
        run: |
          APPS_ROOT=~/apps-testnet
          APP_DIR="$APPS_ROOT/l4va-client"
          COMPOSE_PROJECT_NAME=l4va-testnet-client
          export CONTAINER_PREFIX=l4va-testnet
          export L4VA_NETWORK_NAME=l4va-testnet-network
          export CLIENT_HOST_PORT=5273

          sudo mkdir -p "$APP_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$APP_DIR"
          cd "$APP_DIR"
          # Remove old src files to prevent stale files (e.g., renamed .js -> .ts)
          rm -rf src/
          # Install rsync if not available
          if ! command -v rsync &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y rsync
          fi
          # Copy all files from workspace
          rsync -a --delete --exclude 'node_modules' --exclude '.env' --exclude 'dist' "$GITHUB_WORKSPACE/" "$APP_DIR/"
          # Copy environment-specific files
          cp "$GITHUB_WORKSPACE/.env" "$APP_DIR/.env"
          docker compose -p "$COMPOSE_PROJECT_NAME" build l4va-client
          docker compose -p "$COMPOSE_PROJECT_NAME" up -d --force-recreate l4va-client

  deploy-prod:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build-check
    runs-on: [self-hosted, prod]
    steps:
      - uses: actions/checkout@v3

      - name: Create .env for Mainnet
        env:
          MAINNET_ENV_VARS: ${{ secrets.MAINNET_ENV_VARS }}
        run: |
          echo "$MAINNET_ENV_VARS" > .env
          echo "Created MAINNET .env"

      - name: Build and deploy on Prod server
        run: |
          APPS_ROOT=~/apps
          APP_DIR="$APPS_ROOT/l4va-client"
          COMPOSE_PROJECT_NAME=l4va-client-prod
          export CONTAINER_PREFIX=l4va
          export L4VA_NETWORK_NAME=l4va-network
          export CLIENT_HOST_PORT=5173

          sudo mkdir -p "$APP_DIR"
          sudo chown -R "$(id -u):$(id -g)" "$APP_DIR"
          cd "$APP_DIR"
          # Remove old src files to prevent stale files (e.g., renamed .js -> .ts)
          rm -rf src/
          # Install rsync if not available
          if ! command -v rsync &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y rsync
          fi
          # Copy all files from workspace
          rsync -a --delete --exclude 'node_modules' --exclude '.env' --exclude 'dist' "$GITHUB_WORKSPACE/" "$APP_DIR/"
          # Copy environment-specific files
          cp "$GITHUB_WORKSPACE/.env" "$APP_DIR/.env"
          docker compose -p "$COMPOSE_PROJECT_NAME" build l4va-client
          docker compose -p "$COMPOSE_PROJECT_NAME" up -d --force-recreate l4va-client
