server {
    listen 80;
    server_name l4va.cryptounity.space;

    # Allow uploads up to 5MB
    client_max_body_size 5M;

    # SSL parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # The HTML names the hashed chunks of the current build, so it must never be served from a
    # browser cache: a stale copy asks for chunks the next deploy has removed (404, broken pages).
    # SPA routes fall back here through try_files, so this covers them too.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
